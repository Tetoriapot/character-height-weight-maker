<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>身長・体重メーカー｜キャラクターの体格を見える化</title>
    <meta name="description" content="マネキンでキャラクターの身長差・体格・頭身を比較。身近な物との比較、キャラ保存、PNG保存に対応した無料の創作ツール。" />
    <meta name="theme-color" content="#f5f8fb" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      try {
        const savedTheme = localStorage.getItem('character-maker-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>身長・体重メーカーを使うには、ブラウザのJavaScriptを有効にしてください。</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
